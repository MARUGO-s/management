name: Submission receipts

on:
  pull_request:
  push:
    branches: [main, fix/prevent-duplicate-submissions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/*.cjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno test --allow-env scripts/test_password_hash.ts scripts/test_session_authorization.ts
      - run: python3 scripts/test_password_bootstrap_local.py
      - run: python3 scripts/test_local_function_authorization.py
      - run: python3 scripts/test_login_rate_limit_local.py
      - run: |
          node --check config.js
          node --check js/simple-auth.js
          node --check js/usage-indicator.js
          node --check js/loan-date-policy.js
          node --check js/submission-receipts.js
          node --check js/duplicate-check.js
          node --check js/duplicate-review.js
          node --check pages/js/main.js
          node --check js/input-layout-mode.js
          node --check pages/js/correction.js
          node --check js/unified-data-loader.js
          git diff --check
